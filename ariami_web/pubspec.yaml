name: ariami_web
description: "Ariami Web - Browser music streaming player"
publish_to: 'none'
version: 5.3.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ariami_core:
    path: ../ariami_core
  shared_preferences: ^2.2.0
  file_picker: ^11.0.0
  path: ^1.8.0
  http: ^1.1.0
  url_launcher: ^6.3.0
  web_socket_channel: ^3.0.1
  just_audio: ^0.10.5
  palette_generator: ^0.3.3+4
  flutter_colorpicker: ^1.1.0
  uuid: ^4.0.0
  provider: ^6.1.2
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/Ariami_icon.png

  shaders:
    - shaders/music_visualizer.frag

  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
    - family: Archivo Condensed
      fonts:
        - asset: assets/fonts/ArchivoCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/ArchivoCondensed-SemiBold.ttf
          weight: 600
    - family: Archivo Extra Condensed
      fonts:
        - asset: assets/fonts/ArchivoExtraCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ArchivoExtraCondensed-Bold.ttf
          weight: 700
