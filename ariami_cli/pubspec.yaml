name: ariami_cli
description: CLI version of Ariami for headless servers
version: 5.3.0
publish_to: 'none'

environment:
  sdk: ^3.5.0

dependencies:
  # Flutter SDK for web UI
  flutter:
    sdk: flutter

  # Shared core library
  ariami_core:
    path: ../ariami_core

  # CLI argument parsing
  args: ^2.4.0

  # File system paths
  path: ^1.8.0
  path_provider: ^2.1.0

  # Browser launching
  url_launcher: ^6.1.0

  # Configuration storage
  shared_preferences: ^2.2.0

  # Static file serving (for web UI in Phase 5)
  shelf_static: ^1.1.0

  # QR code generation (web-compatible)
  qr_flutter: ^4.1.0

  # HTTP client for web API calls
  http: ^1.1.0

  # Low-level web/DOM access for the served Flutter web UI (clipboard fallback)
  web: ^1.1.0

  # Browser-native selection of Spotify Extended Streaming History JSON files
  file_picker: ^11.0.0

dev_dependencies:
  lints: ^6.1.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Archivo (SIL OFL, assets/fonts/OFL.txt), the same cuts Ariami Desktop
  # Premium ships; see AppTheme for which width does what.
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
    - family: Archivo Condensed
      fonts:
        - asset: assets/fonts/ArchivoCondensed-SemiBold.ttf
          weight: 600
    - family: Archivo Extra Condensed
      fonts:
        - asset: assets/fonts/ArchivoExtraCondensed-SemiBold.ttf
          weight: 600

executables:
  ariami_cli:
